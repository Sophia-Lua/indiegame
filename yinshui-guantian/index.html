<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>引水灌田</title>
<style>
:root{
  --ink:#2c3a2e; --sub:#77836d; --line:#d8d2bd;
  --paper:#f8f4e9; --green:#3f6b45; --amber:#b8792e; --blue:#2f6f8f;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;color:var(--ink);
  background:
    radial-gradient(circle at 18% 8%,rgba(255,255,255,.55),transparent 42%),
    radial-gradient(circle at 82% 82%,rgba(112,92,54,.13),transparent 46%),
    #e9e1cd;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;}
#app{max-width:560px;margin:0 auto;padding:16px 14px 28px}

.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;padding:0 2px}
.top .left{display:flex;align-items:center;gap:10px;min-width:0}
.top h1{font-size:20px;font-weight:800;letter-spacing:2px;margin:0;color:#304c35;white-space:nowrap;text-shadow:0 1px 0 rgba(255,255,255,.6)}
.top .sub{font-size:12px;color:var(--sub);margin-left:8px;font-weight:500}
.chip{font-size:12px;font-weight:700;color:#5d6d55;background:rgba(255,252,242,.86);border:1px solid #d8d2bd;
  padding:6px 12px;border-radius:20px;white-space:nowrap;flex:none;box-shadow:0 1px 3px rgba(74,58,32,.06)}

.badge{display:inline-flex;align-items:center;gap:5px;background:rgba(255,252,242,.92);border:1px solid #d8d2bd;
  border-radius:10px;padding:6px 9px;box-shadow:0 1px 4px rgba(74,58,32,.08);flex:none}
.badge svg{width:15px;height:15px;color:var(--green);display:block;flex:none}
.badge b{font-size:16px;font-weight:800;color:var(--green);line-height:1;font-variant-numeric:tabular-nums}

.panel{background:rgba(255,252,242,.92);border:1px solid #d5cfba;border-radius:18px;box-shadow:0 8px 24px rgba(74,58,32,.10)}
.boardBox{padding:9px;overflow:hidden}
canvas{display:block;width:100%;height:auto;border-radius:12px;touch-action:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.45)}

.row{display:grid;gap:8px;margin-top:12px}
.row.three{grid-template-columns:repeat(3,1fr)}
.row.two{grid-template-columns:1fr 1fr}
.btn{border:1px solid #cfc7ae;border-radius:12px;padding:12px 4px;font-size:13px;font-weight:700;
  cursor:pointer;background:linear-gradient(#fffdf6,#f0e9d6);color:#4b5a45;
  transition:filter .15s,transform .08s;box-shadow:0 2px 0 #d8cfb6,0 4px 10px rgba(74,58,32,.08)}
.btn:hover{filter:brightness(1.03)}
.btn:active:not(:disabled){transform:translateY(2px);box-shadow:0 0 0 #d8cfb6,0 2px 5px rgba(74,58,32,.10)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:linear-gradient(#fffdf6,#f3ecd9)}
.btn.warm{background:linear-gradient(#c98938,#a96a24);color:#fff;border-color:#965c1e;
  box-shadow:0 2px 0 #7f4d19,0 4px 10px rgba(120,72,22,.16)}
.note{text-align:center;font-size:11px;color:#928e7c;margin-top:16px}

.mask{position:fixed;inset:0;background:rgba(28,38,28,.48);display:flex;align-items:center;justify-content:center;
  padding:20px;z-index:50}
.hide{display:none}
.dialog{background:var(--paper);border:1px solid #d8d2bd;border-radius:18px;width:100%;max-width:380px;padding:24px;
  box-shadow:0 16px 48px rgba(40,32,18,.24);animation:in .2s ease-out}
@keyframes in{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
.dialog h2{font-size:18px;text-align:center;margin:0 0 4px;color:#304c35}
.dialog .grade{text-align:center;font-size:12px;color:var(--sub)}
.dialog .grade b{display:block;font-size:40px;line-height:1.3;color:var(--amber)}
.dialog .pts{text-align:center;font-size:13px;color:var(--sub);margin:6px 0 16px}
.dialog .pts strong{font-size:30px;color:var(--ink);margin:0 3px}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;background:#f1ecdb;border-radius:10px;padding:12px}
.dgrid div{font-size:13px;color:var(--sub)}
.dgrid b{float:right;color:var(--ink);font-variant-numeric:tabular-nums}
.best{margin-top:10px;font-size:12px;color:var(--sub);text-align:center}
.dialog .row{margin-top:18px}
.small{font-size:10.5px;color:#a29c88;text-align:center;margin-top:14px}
.toast{position:fixed;left:50%;top:45%;transform:translate(-50%,-50%);background:#334536;color:#fff;
  padding:12px 18px;border-radius:10px;font-size:14px;z-index:80;max-width:80%;text-align:center}
@media(max-width:380px){#app{padding:12px 10px 22px}.btn{font-size:12px}}
</style>
</head>
<body>
<div id="app">
  <div class="top">
    <div class="left">
      <div class="badge" title="剩余挖掘次数">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 22l1-1h3l9-9"/>
          <path d="M3 21v-3l9-9"/>
          <path d="M15 6l3.4-3.4a2.1 2.1 0 1 1 3 3L18 9l.4.4a2.1 2.1 0 1 1-3 3l-3.8-3.8a2.1 2.1 0 1 1 3-3l.4.4Z"/>
        </svg>
        <b id="diggsLeft">0</b>
      </div>
      <h1>引水灌田</h1>
    </div>
    <div class="chip" id="levelTitle">第 1 关 · 初见水</div>
  </div>

  <div class="panel boardBox"><canvas id="board"></canvas></div>

  <div class="row three">
    <button class="btn ghost" id="undoBtn">撤销</button>
    <button class="btn ghost" id="resetBtn">重置</button>
    <button class="btn warm" id="submitBtn">交卷</button>
  </div>
  <div class="row two">
    <button class="btn ghost" id="prevBtn">← 上一关</button>
    <button class="btn ghost" id="nextBtn">下一关 →</button>
  </div>
  <div class="note">本游戏为开放试玩，不收集个人信息。</div>
</div>

<div class="mask hide" id="resultOverlay">
  <div class="dialog">
    <h2>本关结算</h2>
    <div class="grade"><b id="rRank">无</b>评级</div>
    <div class="pts">总分 <strong id="rTotal">0</strong></div>
    <div class="dgrid">
      <div>灌溉农田 <b id="rFarms">0</b></div>
      <div>湿润草格 <b id="rMoist">0</b></div>
      <div>剩余挖掘 <b id="rDiggs">0</b></div>
      <div>评级 <b id="rRankMini">无</b></div>
    </div>
    <div class="best">本关最优：<span id="rBest">-</span></div>
    <div class="row three" style="grid-template-columns:repeat(3,1fr)">
      <button class="btn ghost" id="replayBtn">重玩</button>
      <button class="btn warm" id="nextLevelBtn">下一关</button>
      <button class="btn ghost" id="shareBtn">分享</button>
    </div>
    <div class="small">本游戏为开放试玩，不收集个人信息。</div>
  </div>
</div>
<div class="toast hide" id="toast"></div>

<script>
(function(){
'use strict';
var CELL={GRASS:0,WATER:1,STONE:2,FARM:3,DITCH:4};
var P={
  grass:[98,134,70],grassWet:[70,108,64],grassHi:[158,182,114],
  water:[36,96,126],waterHi:[78,144,162],
  stone:[128,130,120],farm:[158,126,84],farmWet:[104,78,50],
  soil:[150,126,90],soilWet:[96,72,48]
};
var sceneCanvas=null,sceneDirty=true;
function mixc(a,b,t){t=Math.max(0,Math.min(1,t));return 'rgb('+Math.round(a[0]+(b[0]-a[0])*t)+','+Math.round(a[1]+(b[1]-a[1])*t)+','+Math.round(a[2]+(b[2]-a[2])*t)+')';}
function mixa(a,b,t){t=Math.max(0,Math.min(1,t));return [a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];}
var W=720,H=740,AREA={x:22,y:18,w:676,h:700};
var DIRS=[[0,1],[0,-1],[1,0],[-1,0]];

var LEVELS=[
 {name:'初见水',size:9,maxDiggs:6,pressure:4,
  map:['WW.......','WW.......','.........','...F.....','.........','.........','.........','.........','.........'],
  thresholds:{bronze:20,silver:30,gold:36},best:{score:36,digs:3,farms:1,moist:7},
  tip:'教学：水会灌满整条渠。挖 3 格连到农田，剩余次数都是奖励分。'},
 {name:'石缝田',size:9,maxDiggs:7,pressure:7,
  map:['WW..#....','WW..#....','....#....','....#....','.....F...','....#....','....#....','....#....','....#....'],
  thresholds:{bronze:20,silver:26,gold:34},best:{score:34,digs:6,farms:1,moist:11},
  tip:'教学：石墙只留一道缝，把水渠从缺口送过去。'},
 {name:'一渠多灌',size:11,maxDiggs:7,pressure:7,
  map:['WW.........','WW.........','...##......','...F.......','.....F.....','...F.......','...........','...........','...........','...........','...........'],
  thresholds:{bronze:40,silver:60,gold:74},best:{score:74,digs:6,farms:3,moist:11},
  tip:'一格水渠可以同时贴到多块农田，先想好站位再挖。'},
 {name:'双源',size:13,maxDiggs:6,pressure:4,
  map:['WW...........','WW...........','...F.........','.............','..F..........','.............','.....#...#...','.............','.............','..........F..','.........F...','...........WW','...........WW'],
  thresholds:{bronze:40,silver:65,gold:101},best:{score:101,digs:5,farms:4,moist:18},
  tip:'两个水塘各自成源，从最近的一边引水最省次数。'},
 {name:'少挖多得',size:15,maxDiggs:6,pressure:3,
  map:['WW.............','WWF............','F..F...........','.FF............','...............','...............','....###........','...............','...............','.......###.....','...............','...............','.....###.......','...............','...............'],
  thresholds:{bronze:60,silver:90,gold:113},best:{score:113,digs:2,farms:5,moist:1},
  tip:'少挖多得：有些农田紧挨水源，只需两格水渠就能全部灌溉。'}
];

var state={levelIndex:0,size:9,grid:[],originalGrid:[],maxDiggs:6,diggsLeft:6,pressure:4,history:[],
  charged:[],irrigated:[],moist:[],baseScore:0,hover:null,submitted:false,layout:null,dryWarned:false,welcomed:false};
var canvas,ctx,timer=null;

function parseMap(a,n){var g=[];for(var y=0;y<n;y++){var r=[],l=a[y]||'';for(var x=0;x<n;x++){
  var c=l.charAt(x)||'.';r.push(c==='W'?CELL.WATER:c==='#'?CELL.STONE:c==='F'?CELL.FARM:CELL.GRASS);}g.push(r);}return g;}
function copy(g){return g.map(function(r){return r.slice();});}
function bools(n){var a=[];for(var y=0;y<n;y++){var r=[];for(var x=0;x<n;x++)r.push(false);a.push(r);}return a;}

function computeWater(g,n,pressure){
  var lv=[],vis=[],y,x;
  for(y=0;y<n;y++){var a=[],b=[];for(x=0;x<n;x++){a.push(0);b.push(-1);}lv.push(a);vis.push(b);}
  var q=[],h=0;
  for(y=0;y<n;y++)for(x=0;x<n;x++)if(g[y][x]===CELL.WATER){lv[y][x]=pressure;vis[y][x]=0;q.push([x,y]);}
  while(h<q.length){
    var c=q[h++],cx=c[0],cy=c[1],d0=vis[cy][cx];
    for(var i=0;i<4;i++){
      var nx=cx+DIRS[i][0],ny=cy+DIRS[i][1];
      if(nx<0||ny<0||nx>=n||ny>=n||vis[ny][nx]!==-1)continue;
      if(g[ny][nx]!==CELL.DITCH)continue;
      var d=d0+1;vis[ny][nx]=d;
      var L=pressure-d;
      if(L>0){lv[ny][nx]=L;q.push([nx,ny]);}
    }
  }
  return lv;
}
function computeScore(g,ch,n){
  var ir=bools(n),mo=bools(n);
  for(var y=0;y<n;y++)for(var x=0;x<n;x++){
    var c=g[y][x];if(c!==CELL.FARM&&c!==CELL.GRASS)continue;
    for(var i=0;i<4;i++){var nx=x+DIRS[i][0],ny=y+DIRS[i][1];
      if(nx<0||ny<0||nx>=n||ny>=n)continue;
      var nc=g[ny][nx];
      if(nc===CELL.WATER||(nc===CELL.DITCH&&ch[ny][nx]>0)){
        if(c===CELL.FARM)ir[y][x]=true;else mo[y][x]=true;break;}}}
  return{irrigated:ir,moist:mo};
}
function calc(){
  var ir=0,mo=0;
  for(var y=0;y<state.size;y++)for(var x=0;x<state.size;x++){
    if(state.irrigated[y][x])ir++;if(state.moist[y][x])mo++;}
  var bonus=state.diggsLeft*3;
  return{total:ir*20+mo+bonus,ir:ir,mo:mo};
}
function recalc(){state.charged=computeWater(state.grid,state.size,state.pressure);
  var r=computeScore(state.grid,state.charged,state.size);
  state.irrigated=r.irrigated;state.moist=r.moist;sceneDirty=true;}

function rr(g,x,y,w,h,r){r=Math.min(r,w/2,h/2);g.beginPath();g.moveTo(x+r,y);
  g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);
  g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
function layout(){var c=Math.floor(Math.min(AREA.w,AREA.h)/state.size),bw=c*state.size;
  return{c:c,bw:bw,x:AREA.x+Math.floor((AREA.w-bw)/2),y:AREA.y+Math.floor((AREA.h-bw)/2)};}

function hash2(x,y){var n=Math.sin(x*127.1+y*311.7)*43758.5453123;return n-Math.floor(n);}
function vnoise(x,y){
  var ix=Math.floor(x),iy=Math.floor(y),fx=x-ix,fy=y-iy;
  var ux=fx*fx*(3-2*fx),uy=fy*fy*(3-2*fy);
  var a=hash2(ix,iy),b=hash2(ix+1,iy),c=hash2(ix,iy+1),d=hash2(ix+1,iy+1);
  return a+(b-a)*ux+(c-a)*uy+(a-b-c+d)*ux*uy;
}
function fbm(x,y){return vnoise(x,y)*0.62+vnoise(x*2.13,y*2.13)*0.27+vnoise(x*4.7,y*4.7)*0.11;}
function smooth(t){t=Math.max(0,Math.min(1,t));return t*t*(3-2*t);}

function wetnessAt(x,y){
  var n=state.size,best=0;
  for(var dy=-2;dy<=2;dy++)for(var dx=-2;dx<=2;dx++){
    var d=Math.abs(dx)+Math.abs(dy);if(d>2)continue;
    var nx=x+dx,ny=y+dy;if(nx<0||ny<0||nx>=n||ny>=n)continue;
    var c=state.grid[ny][nx];
    if(c!==CELL.WATER&&!(c===CELL.DITCH&&state.charged[ny][nx]>0))continue;
    var v=d===0?1:(d===1?0.76:0.34);
    if(v>best)best=v;
  }
  return best;
}
function wetnessPx(px,py,c){
  var n=state.size,gx0=Math.floor(px/c),gy0=Math.floor(py/c),best=0;
  for(var gy=gy0-2;gy<=gy0+2;gy++)for(var gx=gx0-2;gx<=gx0+2;gx++){
    if(gx<0||gy<0||gx>=n||gy>=n)continue;
    var cc=state.grid[gy][gx];
    if(cc!==CELL.WATER&&!(cc===CELL.DITCH&&state.charged[gy][gx]>0))continue;
    var dx=(px-(gx+0.5)*c)/c,dy=(py-(gy+0.5)*c)/c,d=Math.sqrt(dx*dx+dy*dy),v=0;
    if(d<0.55)v=1;else if(d<1.1)v=0.78*(1-(d-0.55)/0.55*0.35);
    else if(d<1.8)v=0.38*(1-(d-1.1)/0.7*0.5);
    if(v>best)best=v;
  }
  return best;
}

function baseColor(gx,gy,px,py,c){
  var f=fbm(px/c*0.9,py/c*0.9),f2=fbm(px/c*2.6+17,py/c*2.6+9);
  var t=state.grid[gy][gx],col;
  if(t===CELL.GRASS){
    var w=wetnessPx(px,py,c),big=fbm(px/c*0.35+31,py/c*0.35+7);
    var shade=smooth(0.06+0.48*f+0.24*f2+0.44*big);
    col=mixa(mixa(P.grass,P.grassWet,w),P.grassHi,shade);
    if(shade>0.62)col=mixa(col,[176,190,122],(shade-0.62)*0.45);
  }else if(t===CELL.WATER){
    col=mixa(P.water,P.waterHi,0.35+0.5*f);
  }else if(t===CELL.STONE){
    col=mixa(P.stone,[170,170,158],0.30+0.55*f);
  }else if(t===CELL.FARM){
    var fw=state.irrigated[gy][gx]?0.78:0;
    col=mixa(mixa(P.farm,P.farmWet,fw),[190,160,116],(0.30+0.5*f)*0.45);
  }else{
    var charged=state.charged[gy][gx]>0;
    col=charged?mixa([92,72,48],[58,96,104],0.25+0.25*f)
               :mixa(P.soil,[186,162,124],0.35+0.45*f);
  }
  return col;
}
function terrainColor(px,py,c,L){
  var n=state.size,gx=Math.floor(px/c),gy=Math.floor(py/c);
  if(gx<0)gx=0;if(gy<0)gy=0;if(gx>=n)gx=n-1;if(gy>=n)gy=n-1;
  var col=baseColor(gx,gy,px,py,c),edge=c*0.05;
  var lx=px-gx*c,ly=py-gy*c,blend=0,nx=gx,ny=gy;
  if(lx<edge&&gx>0){nx=gx-1;blend=(1-lx/edge)*0.35;}
  else if(lx>c-edge&&gx<n-1){nx=gx+1;blend=((lx-(c-edge))/edge)*0.35;}
  else if(ly<edge&&gy>0){ny=gy-1;blend=(1-ly/edge)*0.35;}
  else if(ly>c-edge&&gy<n-1){ny=gy+1;blend=((ly-(c-edge))/edge)*0.35;}
  if(blend>0&&state.grid[ny][nx]!==state.grid[gy][gx]){
    col=mixa(col,baseColor(nx,ny,px,py,c),smooth(blend));
  }
  return col;
}
function buildTerrain(L){
  var bw=L.bw,tw=Math.max(1,Math.round(bw*0.6));
  var off=document.createElement('canvas');off.width=tw;off.height=tw;
  var g=off.getContext('2d'),img=g.createImageData(tw,tw),d=img.data,sx=bw/tw;
  for(var y=0;y<tw;y++)for(var x=0;x<tw;x++){
    var col=terrainColor((x+0.5)*sx,(y+0.5)*sx,L.c,L),i=(y*tw+x)*4;
    d[i]=col[0]|0;d[i+1]=col[1]|0;d[i+2]=col[2]|0;d[i+3]=255;
  }
  g.putImageData(img,0,0);return off;
}

function drawGrass(g,gx,gy,c,x,y){
  g.save();g.beginPath();g.rect(gx,gy,c,c);g.clip();
  var tufts=14+Math.floor(hash2(x*3+1,y*5+2)*8);
  g.lineCap='round';
  for(var i=0;i<tufts;i++){
    var h1=hash2(x*17+i*3,y*23+i*7),h2=hash2(x*29+i*5,y*31+i*11),h3=hash2(x*37+i*7,y*41+i*13);
    var bx=gx+h1*c,by=gy+h2*c,w=wetnessPx(bx,by,c),blades=2+Math.floor(h3*3);
    g.fillStyle='rgba(24,52,24,'+(0.05+w*0.04)+')';
    g.beginPath();g.ellipse(bx,by,c*0.035,c*0.014,0,0,Math.PI*2);g.fill();
    for(var b=0;b<blades;b++){
      var h4=hash2(x*43+i*7+b*13,y*47+i*11+b*17),h5=hash2(x*53+i*3+b*19,y*59+i*5+b*23);
      var len=c*(0.035+h4*0.045),lean=(h5-0.5)*len*1.8;
      g.strokeStyle=h4>0.30?'rgba(26,60,28,'+(0.20+w*0.14)+')':'rgba(202,220,142,'+(0.22-w*0.08)+')';
      g.lineWidth=Math.max(0.6,c*0.010);
      g.beginPath();g.moveTo(bx+(h5-0.5)*c*0.02,by);
      g.quadraticCurveTo(bx+lean*0.40,by-len*0.55,bx+lean,by-len);g.stroke();
    }
  }
  if(hash2(x*53,y*59)>0.78){
    g.fillStyle='rgba(246,238,190,.65)';g.beginPath();
    g.arc(gx+c*(0.28+hash2(x,y)*0.44),gy+c*(0.30+hash2(y,x)*0.38),Math.max(1,c*0.020),0,Math.PI*2);g.fill();
  }
  g.restore();
}
function drawFarm(g,gx,gy,c,x,y){
  g.save();g.beginPath();g.rect(gx,gy,c,c);g.clip();
  var wet=state.irrigated[y][x],rows=5,gap=c/rows;
  for(var k=0;k<rows;k++){
    var wig=Math.sin(x*1.3+k*2.1)*c*0.025,yy=gy+(k+0.55)*gap;
    g.strokeStyle=wet?'rgba(48,30,14,.36)':'rgba(66,42,18,.34)';g.lineWidth=gap*0.46;
    g.beginPath();g.moveTo(gx-c*0.08,yy+wig);
    g.quadraticCurveTo(gx+c*0.5,yy-wig*1.4,gx+c*1.08,yy+wig*0.6);g.stroke();
    g.strokeStyle=wet?'rgba(216,198,152,.20)':'rgba(230,206,160,.24)';g.lineWidth=gap*0.22;
    g.beginPath();g.moveTo(gx-c*0.08,yy-gap*0.26+wig);
    g.quadraticCurveTo(gx+c*0.5,yy-gap*0.26-wig,gx+c*1.08,yy-gap*0.26+wig*0.6);g.stroke();
  }
  for(var k=0;k<rows;k++)for(var j=0;j<3;j++){
    var hx=hash2(x*11+k*3+j*7,y*13+k*5+j*11);
    var px=gx+c*(0.12+j*0.30+hx*0.10),py=gy+k*gap+gap*(0.20+hx*0.10),sc=c*(0.12+hx*0.04);
    g.strokeStyle=wet?'rgba(52,104,44,.92)':'rgba(96,124,52,.82)';g.lineWidth=Math.max(1,c*0.020);
    g.beginPath();g.moveTo(px,py+sc*0.9);g.lineTo(px,py-sc*0.25);g.stroke();
    g.fillStyle=wet?'rgba(74,132,56,.92)':'rgba(116,146,66,.86)';
    g.beginPath();g.ellipse(px-sc*0.60,py-sc*0.32,sc*0.62,sc*0.28,-0.55,0,Math.PI*2);g.fill();
    g.beginPath();g.ellipse(px+sc*0.60,py-sc*0.32,sc*0.62,sc*0.28,0.55,0,Math.PI*2);g.fill();
    g.fillStyle='rgba(226,236,180,.24)';g.beginPath();g.ellipse(px-sc*0.62,py-sc*0.40,sc*0.26,sc*0.10,-0.55,0,Math.PI*2);g.fill();
  }
  for(var i=0;i<16;i++){
    var px=gx+hash2(x*7+i,y*17)*c,py=gy+hash2(x*19+i,y*23)*c,ps=Math.max(1,c*0.030);
    g.fillStyle=hash2(x+i,y+i)>0.5?'rgba(255,238,202,.16)':'rgba(52,32,14,.16)';
    g.fillRect(px,py,ps,ps);
  }
  g.restore();
}
function drawStone(g,gx,gy,c,x,y){
  g.save();g.beginPath();g.rect(gx,gy,c,c);g.clip();
  var count=4+Math.floor(hash2(x*7,y*11)*3);
  for(var i=0;i<count;i++){
    var hx=hash2(x*13+i*5,y*17+i*9),hy=hash2(x*19+i*7,y*23+i*3);
    var px=gx+c*(0.15+hx*0.70),py=gy+c*(0.15+hy*0.70),r=c*(0.10+hash2(x+i*31,y+i*37)*0.10);
    g.fillStyle='rgba(30,30,26,.18)';g.beginPath();g.ellipse(px+r*0.25,py+r*0.30,r*1.05,r*0.75,0,0,Math.PI*2);g.fill();
    g.fillStyle='rgba(150,151,140,.95)';g.beginPath();
    for(var p=0;p<6;p++){
      var a=p/6*Math.PI*2,rr2=r*(0.82+hash2(i*7+p,x*3+y)*0.25);
      var vx=px+Math.cos(a)*rr2,vy=py+Math.sin(a)*rr2*0.78;
      p===0?g.moveTo(vx,vy):g.lineTo(vx,vy);
    }
    g.closePath();g.fill();
    g.strokeStyle='rgba(52,54,48,.32)';g.lineWidth=Math.max(0.8,c*0.012);g.stroke();
    g.fillStyle='rgba(255,255,255,.18)';g.beginPath();g.ellipse(px-r*0.25,py-r*0.25,r*0.35,r*0.18,-0.5,0,Math.PI*2);g.fill();
  }
  g.restore();
}
function waterComponents(){
  var n=state.size,vis=bools(n),comps=[];
  for(var y=0;y<n;y++)for(var x=0;x<n;x++){
    if(state.grid[y][x]!==CELL.WATER||vis[y][x])continue;
    var q=[[x,y]],h=0,cells=[];vis[y][x]=true;
    while(h<q.length){
      var p=q[h++];cells.push(p);
      for(var i=0;i<4;i++){
        var nx=p[0]+DIRS[i][0],ny=p[1]+DIRS[i][1];
        if(nx<0||ny<0||nx>=n||ny>=n||vis[ny][nx])continue;
        if(state.grid[ny][nx]===CELL.WATER){vis[ny][nx]=true;q.push([nx,ny]);}
      }
    }
    comps.push(cells);
  }
  return comps;
}
function drawPonds(g,L){
  var c=L.c,comps=waterComponents();
  for(var ci=0;ci<comps.length;ci++){
    var cells=comps[ci],minx=1e9,miny=1e9,maxx=-1e9,maxy=-1e9;
    for(var i=0;i<cells.length;i++){
      minx=Math.min(minx,cells[i][0]);maxx=Math.max(maxx,cells[i][0]);
      miny=Math.min(miny,cells[i][1]);maxy=Math.max(maxy,cells[i][1]);
    }
    var x0=L.x+minx*c,y0=L.y+miny*c,w=(maxx-minx+1)*c,h=(maxy-miny+1)*c;
    var cx=x0+w/2,cy=y0+h/2,rx=w*0.62,ry=h*0.62;
    function blob(scale){
      g.beginPath();
      for(var a=0;a<=Math.PI*2+0.01;a+=0.13){
        var jt=scale+(hash2(ci*13+a*2.7,ci*7+a*3.1)-0.5)*0.16;
        var vx=cx+Math.cos(a)*rx*jt,vy=cy+Math.sin(a)*ry*jt;
        a===0?g.moveTo(vx,vy):g.lineTo(vx,vy);
      }
      g.closePath();
    }
    g.fillStyle='rgba(84,66,42,.42)';blob(1.03);g.fill();
    g.fillStyle='rgba(138,124,88,.55)';blob(0.97);g.fill();
    var grd=g.createRadialGradient(cx-rx*0.22,cy-ry*0.28,rx*0.08,cx,cy,Math.max(rx,ry));
    grd.addColorStop(0,'#5fa2b4');grd.addColorStop(0.55,'#2f7f9c');grd.addColorStop(1,'#1d5f7e');
    g.fillStyle=grd;blob(0.90);g.fill();
    g.lineCap='round';
    for(var e=0;e<10;e++){
      var a=hash2(ci*17+e*3,ci*19+e*5)*Math.PI*2;
      var px=cx+Math.cos(a)*rx*0.97,py=cy+Math.sin(a)*ry*0.97;
      g.strokeStyle='rgba(46,88,44,.42)';g.lineWidth=Math.max(1,c*0.022);
      g.beginPath();g.moveTo(px,py);g.lineTo(px+Math.cos(a)*c*0.05,py-c*0.10);g.stroke();
    }
    g.strokeStyle='rgba(220,242,244,.30)';g.lineWidth=Math.max(1,c*0.022);
    for(var k=0;k<5;k++){
      var a=hash2(ci*7+k,ci*11+k)*Math.PI*2,rr=rx*(0.18+hash2(ci*5+k,ci*3+k)*0.30);
      var px=cx+Math.cos(a)*rx*0.42,py=cy+Math.sin(a)*ry*0.42;
      g.beginPath();g.ellipse(px,py,rr*0.42,rr*0.11,a*0.4,0.15,Math.PI*1.15);g.stroke();
    }
    g.fillStyle='rgba(238,250,250,.14)';g.beginPath();g.ellipse(cx-rx*0.30,cy-ry*0.32,rx*0.26,ry*0.09,-0.45,0,Math.PI*2);g.fill();
  }
}
function drawDitches(g,L){
  var c=L.c,n=state.size;
  function inside(x,y){return x>=0&&y>=0&&x<n&&y<n;}
  function isDitch(x,y){return inside(x,y)&&state.grid[y][x]===CELL.DITCH;}
  function isWater(x,y){return inside(x,y)&&state.grid[y][x]===CELL.WATER;}
  function link(x,y,waterOnly){return isWater(x,y)||(isDitch(x,y)&&(!waterOnly||state.charged[y][x]>0));}
  function channel(g,cx,cy,el,er,eu,ed,jit,seed,soft){
    var pts=[[cx-el,cy-eu],[cx,cy-eu*0.94],[cx+er,cy-eu],[cx+er*0.95,cy],
             [cx+er,cy+ed],[cx,cy+ed*0.94],[cx-el,cy+ed],[cx-el*0.95,cy]];
    for(var i=0;i<8;i++){
      pts[i][0]+=(hash2(seed+i*3,seed*0.7+i*5)-0.5)*jit;
      pts[i][1]+=(hash2(seed+i*7,seed*1.3+i*11)-0.5)*jit;
    }
    g.beginPath();
    if(soft){
      var last=pts[7],mx=(last[0]+pts[0][0])/2,my=(last[1]+pts[0][1])/2;
      g.moveTo(mx,my);
      for(var i=0;i<8;i++){
        var nx=pts[(i+1)%8];g.quadraticCurveTo(pts[i][0],pts[i][1],(pts[i][0]+nx[0])/2,(pts[i][1]+nx[1])/2);
      }
    }else{
      g.moveTo(pts[0][0],pts[0][1]);
      for(var i=1;i<8;i++)g.lineTo(pts[i][0],pts[i][1]);
    }
    g.closePath();
  }
  for(var y=0;y<n;y++)for(var x=0;x<n;x++){
    if(!isDitch(x,y))continue;
    var cx=L.x+x*c+c/2,cy=L.y+y*c+c/2,seed=x*31+y*17;
    var el=link(x-1,y,false)?c*0.52:c*0.30,er=link(x+1,y,false)?c*0.52:c*0.30;
    var eu=link(x,y-1,false)?c*0.52:c*0.30,ed=link(x,y+1,false)?c*0.52:c*0.30;
    g.fillStyle='rgba(54,38,20,.38)';channel(g,cx+c*0.03,cy+c*0.05,el,er,eu,ed,c*0.07,seed,false);g.fill();
    g.fillStyle='rgba(146,116,78,.95)';channel(g,cx,cy,el*0.94,er*0.94,eu*0.94,ed*0.94,c*0.06,seed+3,false);g.fill();
    g.save();channel(g,cx,cy,el*0.90,er*0.90,eu*0.90,ed*0.90,c*0.05,seed+7,false);g.clip();
    for(var i=0;i<10;i++){
      var px=L.x+x*c+hash2(seed+i*5,seed+i*9)*c,py=L.y+y*c+hash2(seed+i*11,seed+i*13)*c;
      g.fillStyle=hash2(seed+i,seed*i)>0.5?'rgba(255,236,198,.16)':'rgba(62,42,20,.18)';
      g.fillRect(px,py,Math.max(1,c*0.025),Math.max(1,c*0.025));
    }
    g.restore();
  }
  for(var y=0;y<n;y++)for(var x=0;x<n;x++){
    if(!isDitch(x,y)||state.charged[y][x]<=0)continue;
    var cx=L.x+x*c+c/2,cy=L.y+y*c+c/2,seed=x*31+y*17+101;
    var el=link(x-1,y,true)?c*0.52:c*0.16,er=link(x+1,y,true)?c*0.52:c*0.16;
    var eu=link(x,y-1,true)?c*0.52:c*0.16,ed=link(x,y+1,true)?c*0.52:c*0.16;
    var lv=state.charged[y][x],tv=state.pressure>0?lv/state.pressure:1;
    var col=mixa([76,138,146],[30,104,148],0.28+tv*0.58);
    g.fillStyle=mixc(col,[16,72,112],0.18);channel(g,cx,cy,el,er,eu,ed,c*0.045,seed,true);g.fill();
    g.fillStyle='rgba(224,242,240,'+(0.10+tv*0.10)+')';
    channel(g,cx-c*0.04,cy-c*0.05,el*0.78,er*0.78,eu*0.70,ed*0.70,c*0.035,seed+5,true);g.fill();
    g.strokeStyle='rgba(230,246,244,'+(0.12+tv*0.14)+')';g.lineWidth=Math.max(0.8,c*0.018);
    g.beginPath();g.arc(cx,cy,c*0.13,0.3,Math.PI*1.15);g.stroke();
  }
}
function rebuildScene(){
  var L=layout();state.layout=L;
  sceneCanvas=document.createElement('canvas');sceneCanvas.width=W;sceneCanvas.height=H;
  var g=sceneCanvas.getContext('2d');
  var bg=g.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#efe7d2');bg.addColorStop(1,'#d9cdb2');
  g.fillStyle=bg;g.fillRect(0,0,W,H);
  for(var i=0;i<260;i++){
    g.fillStyle='rgba(120,100,60,'+(0.02+hash2(i,3)*0.03)+')';
    g.fillRect(hash2(i,7)*W,hash2(i,11)*H,1.5,1.5);
  }
  g.fillStyle='rgba(60,44,26,.20)';rr(g,L.x-12,L.y-12,L.bw+24,L.bw+24,10);g.fill();
  g.fillStyle='#8a6a42';rr(g,L.x-10,L.y-10,L.bw+20,L.bw+20,9);g.fill();
  var wg=g.createLinearGradient(L.x-10,L.y-10,L.x+L.bw+10,L.y+L.bw+10);
  wg.addColorStop(0,'rgba(255,238,200,.30)');wg.addColorStop(1,'rgba(60,40,20,.25)');
  g.fillStyle=wg;rr(g,L.x-10,L.y-10,L.bw+20,L.bw+20,9);g.fill();
  g.fillStyle='#5d472e';rr(g,L.x-4,L.y-4,L.bw+8,L.bw+8,6);g.fill();

  var terrain=buildTerrain(L);g.save();g.beginPath();g.rect(L.x,L.y,L.bw,L.bw);g.clip();
  g.imageSmoothingEnabled=true;g.drawImage(terrain,L.x,L.y,L.bw,L.bw);
  var n=state.size;
  for(var y=0;y<n;y++)for(var x=0;x<n;x++){
    var c=state.grid[y][x],gx=L.x+x*L.c,gy=L.y+y*L.c;
    if(c===CELL.GRASS)drawGrass(g,gx,gy,L.c,x,y);
    else if(c===CELL.FARM)drawFarm(g,gx,gy,L.c,x,y);
    else if(c===CELL.STONE)drawStone(g,gx,gy,L.c,x,y);
  }
  drawPonds(g,L);drawDitches(g,L);
  var lg=g.createLinearGradient(L.x,L.y,L.x+L.bw,L.y+L.bw);
  lg.addColorStop(0,'rgba(255,250,228,.16)');lg.addColorStop(0.45,'rgba(255,255,255,0)');lg.addColorStop(1,'rgba(28,22,12,.18)');
  g.fillStyle=lg;g.fillRect(L.x,L.y,L.bw,L.bw);
  var rg=g.createRadialGradient(L.x+L.bw/2,L.y+L.bw/2,L.bw*0.30,L.x+L.bw/2,L.y+L.bw/2,L.bw*0.78);
  rg.addColorStop(0,'rgba(0,0,0,0)');rg.addColorStop(1,'rgba(24,18,10,.18)');
  g.fillStyle=rg;g.fillRect(L.x,L.y,L.bw,L.bw);
  g.restore();sceneDirty=false;
}
function render(){
  if(!sceneCanvas||sceneDirty)rebuildScene();
  ctx.clearRect(0,0,W,H);ctx.drawImage(sceneCanvas,0,0);
  if(state.hover&&!state.submitted){
    var L=state.layout,hx=state.hover.x,hy=state.hover.y,n=state.size;
    if(hx>=0&&hy>=0&&hx<n&&hy<n&&state.grid[hy][hx]===CELL.GRASS&&state.diggsLeft>0){
      var gx=L.x+hx*L.c,gy=L.y+hy*L.c;
      ctx.fillStyle='rgba(255,255,255,.10)';ctx.fillRect(gx,gy,L.c,L.c);
      ctx.strokeStyle='rgba(255,255,255,.85)';ctx.lineWidth=2;
      ctx.strokeRect(gx+2,gy+2,L.c-4,L.c-4);
    }
  }
}
function at(e){if(!state.layout)return null;var b=canvas.getBoundingClientRect();
  if(!b.width||!b.height)return null;
  var lx=(e.clientX-b.left)*(W/b.width),ly=(e.clientY-b.top)*(H/b.height),L=state.layout;
  var x=Math.floor((lx-L.x)/L.c),y=Math.floor((ly-L.y)/L.c);
  if(x<0||y<0||x>=state.size||y>=state.size)return null;return{x:x,y:y};}
function dig(x,y){
  if(state.submitted||state.diggsLeft<=0||x<0||y<0||x>=state.size||y>=state.size)return;
  if(state.grid[y][x]!==CELL.GRASS)return;
  state.grid[y][x]=CELL.DITCH;state.diggsLeft--;state.history.push({x:x,y:y});
  recalc();render();update();
  if(!state.dryWarned&&state.charged[y][x]===0){
    state.dryWarned=true;
    toast('水压不够：水最多只流 '+(state.pressure-1)+' 格，这里已经断流');
  }}
function undo(){if(state.submitted||!state.history.length)return;
  var p=state.history.pop();state.grid[p.y][p.x]=CELL.GRASS;state.diggsLeft++;
  recalc();render();update();}
function reset(){state.grid=copy(state.originalGrid);state.history=[];
  state.diggsLeft=state.maxDiggs;state.submitted=false;state.hover=null;
  recalc();render();update();hideResult();}
function toast(s){var e=document.getElementById('toast');e.textContent=s;e.classList.remove('hide');
  if(timer)clearTimeout(timer);timer=setTimeout(function(){e.classList.add('hide');},2200);}
function load(i){if(i<0||i>=LEVELS.length)return;var lv=LEVELS[i];
  state.levelIndex=i;state.size=lv.size;state.originalGrid=parseMap(lv.map,lv.size);
  state.grid=copy(state.originalGrid);state.maxDiggs=lv.maxDiggs;state.diggsLeft=lv.maxDiggs;state.pressure=lv.pressure;
  state.history=[];state.hover=null;state.submitted=false;state.dryWarned=false;
  recalc();state.baseScore=calc().total;render();update();hideResult();
  if(i===0&&!state.welcomed){state.welcomed=true;setTimeout(function(){toast('点击草地挖渠，把水引到农田');},450);}}
function submit(){if(state.submitted)return;var s=calc();
  if(s.ir===0){toast('至少灌溉 1 块农田才能交卷');return;}
  state.submitted=true;state.hover=null;showResult(s);update();}
function showResult(s){var lv=LEVELS[state.levelIndex],r='无';
  if(s.total>=lv.thresholds.gold)r='金';else if(s.total>=lv.thresholds.silver)r='银';
  else if(s.total>=lv.thresholds.bronze)r='铜';
  document.getElementById('rTotal').textContent=s.total;
  document.getElementById('rRank').textContent=r;
  document.getElementById('rRankMini').textContent=r;
  document.getElementById('rFarms').textContent=s.ir;
  document.getElementById('rMoist').textContent=s.mo;
  document.getElementById('rDiggs').textContent=state.diggsLeft;
  document.getElementById('rBest').textContent=lv.best.score+' 分（灌溉 '+lv.best.farms+' 块，湿润 '+lv.best.moist+' 格，剩 '+lv.best.digs+' 次）';
  document.getElementById('resultOverlay').classList.remove('hide');}
function hideResult(){document.getElementById('resultOverlay').classList.add('hide');}
function update(){var s=calc(),lv=LEVELS[state.levelIndex];
  document.getElementById('levelTitle').textContent='第 '+(state.levelIndex+1)+' 关 · '+lv.name;
  document.getElementById('diggsLeft').textContent=state.diggsLeft;
  document.getElementById('undoBtn').disabled=state.submitted||!state.history.length;}
function go(i){if(i<0||i>=LEVELS.length){toast('已是最后一关');return;}load(i);}

function init(){
  canvas=document.getElementById('board');ctx=canvas.getContext('2d');
  canvas.width=W;canvas.height=H;
  canvas.addEventListener('click',function(e){var c=at(e);if(c)dig(c.x,c.y);});
  canvas.addEventListener('contextmenu',function(e){e.preventDefault();undo();});
  canvas.addEventListener('mousemove',function(e){if(state.submitted)return;
    var c=at(e),ch=(!c&&state.hover)||(c&&(!state.hover||c.x!==state.hover.x||c.y!==state.hover.y));
    if((!c&&!state.hover)||!ch)return;state.hover=c;render();});
  canvas.addEventListener('mouseleave',function(){if(state.hover){state.hover=null;render();}});
  canvas.addEventListener('touchstart',function(e){e.preventDefault();
    if(!e.touches.length||state.submitted)return;state.hover=at(e.touches[0]);render();},{passive:false});
  canvas.addEventListener('touchend',function(e){e.preventDefault();
    if(state.submitted||!state.hover)return;
    dig(state.hover.x,state.hover.y);},{passive:false});
  canvas.addEventListener('touchcancel',function(){state.hover=null;render();},{passive:false});
  document.getElementById('undoBtn').addEventListener('click',undo);
  document.getElementById('resetBtn').addEventListener('click',reset);
  document.getElementById('submitBtn').addEventListener('click',submit);
  document.getElementById('prevBtn').addEventListener('click',function(){go(state.levelIndex-1);});
  document.getElementById('nextBtn').addEventListener('click',function(){go(state.levelIndex+1);});
  document.getElementById('replayBtn').addEventListener('click',reset);
  document.getElementById('nextLevelBtn').addEventListener('click',function(){go(state.levelIndex+1);});
  document.getElementById('shareBtn').addEventListener('click',function(){toast('分享功能即将开放');});
  document.getElementById('resultOverlay').addEventListener('click',function(e){if(e.target===this)hideResult();});
  window.addEventListener('resize',render);
  load(0);
}
init();
})();
</script>
